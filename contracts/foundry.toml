[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Monad execution rules (gas model, opcode pricing, contract size). Requires Foundry v1.8+.
network = "monad"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# Reproducible bytecode for explorer verification
bytecode_hash = "none"
cbor_metadata = false
use_literal_content = true
fuzz = { runs = 512 }

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
